name: repro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: default
            env: ''
          - name: graph-optimize
            env: 'EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1'
          - name: tree-shaking
            env: 'EXPO_UNSTABLE_TREE_SHAKING=1 EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1'
    name: build (${{ matrix.scenario.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Export web (5x)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== iteration $i ==="
            rm -rf dist .expo
            ${{ matrix.scenario.env }} npx expo export -p web
          done
