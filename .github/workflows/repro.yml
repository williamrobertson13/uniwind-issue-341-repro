name: repro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/myapp
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: default
            env: ''
          - name: graph-optimize
            env: 'EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1'
          - name: tree-shaking
            env: 'EXPO_UNSTABLE_TREE_SHAKING=1 EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1'
    name: build (${{ matrix.scenario.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Export web --dev (5x, full cache clear)
        env:
          EXPO_USE_FAST_RESOLVER: '1'
          REPRO_EXTENSION_MODE: 'true'
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::iteration $i"
            rm -rf dist .expo node_modules/.cache /tmp/metro-cache
            ${{ matrix.scenario.env }} pnpm exec expo export -p web --dev
            echo "::endgroup::"
          done
